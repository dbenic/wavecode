server:
  port: 3777
  host: 0.0.0.0

paths:
  projects_root: ~/Dev/Projects    # spawned agents use <projects_root>/<agent-name>
  worktrees_root: .wavecode-data/worktrees
  transcripts_root: .wavecode-data/transcripts
  teams_root: teams
  guides_root: guides       # cloned guide sources (e.g., awesome-design-md)
  templates_root: templates # cloned template repos (workspace starters)

autonomy:
  auto_dispatch: true
  auto_restart: true
  hang_timeout_min: 10
  max_task_retries: 2

sandbox:
  disable_git_push: true
  restrict_network: true

# Each runtime maps to a CLI command. Optional model_flag/effort_flag are used
# to inject an agent's pinned model/effort into the command at spawn time
# (e.g. `claude ... --model claude-opus-5`). Without the flag the pin is still
# recorded on the agent and checked against delivery reports at review time.
# Live no-click bypass flags. Claude may still show a first-run
# "Bypass Permissions / Yes, I accept" dialog; the output watcher dismisses it.
runtimes:
  claude-code:
    command: claude --dangerously-skip-permissions
    idle_pattern: '\$\s*$'
    model_flag: --model
  grok:
    command: grok --always-approve
    idle_pattern: '^>\s*$'
    model_flag: --model
  codex:
    command: codex --dangerously-bypass-approvals-and-sandbox --dangerously-bypass-hook-trust
    idle_pattern: '^>\s*$'
    model_flag: -m
    # Current Codex CLI: `-c model_reasoning_effort=high`. Flag ends with `=`
    # so WaveCode concatenates the pin with no extra space.
    effort_flag: -c model_reasoning_effort=
  aider:
    command: aider --yes
    idle_pattern: '^>\s*$'
    model_flag: --model

auth:
  method: token                  # default portable mode; set a token before exposing the port
  fallback_token: null           # installer generates one; set manually if you install without it
  trusted_proxies: []

notifications:
  web_push: false
  ntfy_topic: null
  telegram_bot_token: null
  telegram_chat_id: null

artifacts:
  storage: .wavecode-data/artifacts
  retention_days: 30

# Cross-agent review loop. With auto_review on, every finished run is
# reviewed by another agent (default_reviewer by name or runtime; falls back
# to the WaveCode LLM), non-pass verdicts are sent back to the author up to
# max_fix_loops times, and promote is blocked without a 'pass' verdict
# unless the reviewer supplies an explicit override reason.
review:
  auto_review: false
  default_reviewer: aider
  self_review: false
  max_fix_loops: 2
  require_pass_to_promote: true   # gate promote even when auto_review is off
  gate_dependents_on_approval: false  # dependents wait for human approval, not just 'done'

# Per-project verify/referee profiles. A project with a `gate` uses that
# command's RESULT line as the only promote/completion evidence — never the
# agent's self-report, and never the LLM last-30-lines verifier.
# A project (or workspace) without a gate keeps today's behavior.
# The referee cds itself to a shared checkout; WaveCode does not run it
# against worktrees. Unmatched workspaces never invoke this command.
#
# projects:
#   wavepulse:
#     workspace_match: '**/wavepulse*'
#     gate:
#       command: wavepulse-gate
#       branch: landing-v3-human-first
#       mode: full
#       # newest nightly *-full.log for this branch; override if logs live elsewhere
#       # baseline_glob: ~/gate-results/landing-v3-human-first-*-full.log
#     require_result_to_promote: true
#     # optional per-agent branch override
#     # agent_branches:
#     #   opus-wavepulse: landing-v3-human-first

llm:
  provider: anthropic              # 'anthropic' or 'openai-compatible'
  api_key: null                    # primary key (used for command chat)
  anthropic_api_key: null          # or set ANTHROPIC_API_KEY env var
  openai_api_key: null             # or set OPENAI_API_KEY env var
  gemini_api_key: null             # or set GEMINI_API_KEY env var
  perplexity_api_key: null         # or set PERPLEXITY_API_KEY env var
  xai_api_key: null                # or set XAI_API_KEY env var
  base_url: null                   # custom OpenAI-compatible endpoint (see below)
  model: claude-sonnet-4-20250514

# ── Local / self-hosted LLMs ──
# Set provider to 'openai-compatible' and point base_url at your local server.
# Any tool with an OpenAI-compatible API works:
#
#   Ollama:              http://localhost:11434/v1
#   LM Studio:           http://localhost:1234/v1
#   vLLM:                http://localhost:8000/v1
#   llama.cpp / server:  http://localhost:8080/v1
#   LocalAI:             http://localhost:8080/v1
#   Jan:                 http://localhost:1337/v1
#   GPT4All:             http://localhost:4891/v1
#   text-gen-webui:      http://localhost:5000/v1
#   KoboldCpp:           http://localhost:5001/v1
#
# Example (Ollama with Llama 3.3):
#   llm:
#     provider: openai-compatible
#     base_url: http://localhost:11434/v1
#     model: llama3.3
#     api_key: null
